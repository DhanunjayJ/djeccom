spring.application.name=eccom-backend
spring.profiles.default=local

server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

razorpay.key.id=${RZP_TEST_KEY}
razorpay.key.secret=${KEY_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

bootstrap.admin.email=${ADMIN_EMAIL:}
bootstrap.admin.password=${ADMIN_PASSWORD:}
bootstrap.admin.name=${ADMIN_NAME:Store Administrator}
