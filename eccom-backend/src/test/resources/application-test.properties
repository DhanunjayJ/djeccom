spring.datasource.url=jdbc:h2:mem:djcorner;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false
app.cors.allowed-origins=http://localhost:5173

security.jwt.secret=test-only-jwt-signing-key-with-at-least-thirty-two-bytes
security.jwt.expiration-minutes=60

razorpay.key.id=test-key
razorpay.key.secret=test-secret

bootstrap.admin.enabled=false
